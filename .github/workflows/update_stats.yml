name: Update GitHub Stats

on:
  schedule:
    - cron: "0 18 * * *" # 每天 02:00 (UTC+8) 自动刷新
  workflow_dispatch: # 支持在 Actions 页面手动触发
  push:
    paths:
      - "scripts/update_stats.py"
      - ".github/workflows/update_stats.yml"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Actions 内置 token，无需自己配置 PAT
        run: python scripts/update_stats.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          git diff --cached --quiet || git commit -m "chore: refresh README stats [skip ci]"
          git push
